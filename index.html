<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Офлайн-менеджер | Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== ТЕМЫ (светлая / тёмная) ===== */
        :root {
            --bg-page: #ffffff;
            --card-bg: #f5f5f7;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --accent-hover: #0055b3;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --offline-tint: rgba(0,0,0,0.03);
        }

        [data-theme="dark"] {
            --bg-page: #0b0b12;
            --card-bg: #1c1c24;
            --text-primary: #ffffff;
            --text-secondary: #8e8e98;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --offline-tint: rgba(255,255,255,0.03);
        }

        body {
            background: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.2s ease;
        }

        /* Офлайн карточка */
        .offline-container {
            max-width: 360px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 36px;
            padding: 44px 28px 40px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: gentleAppear 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            backdrop-filter: blur(8px);
        }

        @keyframes gentleAppear {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Анимированный Wi-Fi с крестиком */
        .wifi-badge {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            position: relative;
        }
        .wifi-badge svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.1));
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .message-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.45;
            margin-bottom: 28px;
        }

        .retry-btn {
            background: var(--accent);
            border: none;
            border-radius: 60px;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 590;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: 0.18s ease;
            font-family: inherit;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .retry-btn:active {
            transform: scale(0.97);
            background: var(--accent-hover);
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--offline-tint);
            padding: 10px 14px;
            border-radius: 40px;
            margin-top: 8px;
        }

        .pulse-dots {
            display: flex;
            gap: 5px;
        }
        .pulse-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulseMove 1.2s infinite;
        }
        .pulse-dots span:nth-child(2) { animation-delay: 0.2s; }
        .pulse-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulseMove {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.2); }
        }

        .theme-switch {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            z-index: 200;
            box-shadow: var(--shadow);
        }
        .hide { display: none; }
    </style>
</head>
<body>

<div class="offline-container" id="offlineRoot">
    <div class="wifi-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 18C12.8284 18 13.5 18.6716 13.5 19.5C13.5 20.3284 12.8284 21 12 21C11.1716 21 10.5 20.3284 10.5 19.5C10.5 18.6716 11.1716 18 12 18Z" fill="currentColor"/>
            <path d="M12 14C14.7614 14 17 16.2386 17 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 10C16.9706 10 21 14.0294 21 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5 19C5 14.0294 9.02944 10 14 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/>
            <line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#FF453A" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </div>
    <h2>Нет соединения</h2>
    <div class="message-desc" id="dynamicMessage">
        Не удаётся подключиться к серверу.<br>
        Проверьте интернет и нажмите «Проверить»
    </div>
    <button class="retry-btn" id="retryActionBtn">
        <span>⟳</span> Проверить соединение
    </button>
    <div class="status-row" id="statusFooter">
        <span>🔄 Автопроверка через </span>
        <span id="countdownSec">3</span><span>с</span>
        <div class="pulse-dots"><span></span><span></span><span></span></div>
    </div>
</div>

<button class="theme-switch" id="themeSwitcherBtn">🌙 Тёмная тема</button>

<script>
    (function(){
        // ------------------------------------------------------------------
        // 1. ТЕМА (светлая/тёмная) с сохранением
        // ------------------------------------------------------------------
        const root = document.documentElement;
        const themeBtn = document.getElementById('themeSwitcherBtn');
        const savedTheme = localStorage.getItem('offline_manager_theme');
        if(savedTheme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            themeBtn.innerHTML = '☀️ Светлая тема';
        } else {
            themeBtn.innerHTML = '🌙 Тёмная тема';
        }
        themeBtn.onclick = () => {
            const isDark = root.getAttribute('data-theme') === 'dark';
            if(isDark) {
                root.removeAttribute('data-theme');
                localStorage.setItem('offline_manager_theme', 'light');
                themeBtn.innerHTML = '🌙 Тёмная тема';
            } else {
                root.setAttribute('data-theme', 'dark');
                localStorage.setItem('offline_manager_theme', 'dark');
                themeBtn.innerHTML = '☀️ Светлая тема';
            }
        };
        
        // ------------------------------------------------------------------
        // 2. УНИВЕРСАЛЬНАЯ ПРОВЕРКА ИНТЕРНЕТА (работает везде: APK, TMA, браузер)
        // ------------------------------------------------------------------
        // Используем несколько стратегий: 
        // - сначала navigator.onLine (быстро, но может врать)
        // - затем пробуем fetch + Image ping (самый надежный кросс-платформенный)
        // - для Telegram WebApp пробуем специальный метод
        // - timeout 5 секунд, чтобы не зависать
        // ------------------------------------------------------------------
        let currentOnline = true;
        let checkCounter = 0;
        let retryInterval = null;
        let countdownInterval = null;
        let remainingSeconds = 3;
        
        // Элементы UI
        const retryBtn = document.getElementById('retryActionBtn');
        const statusFooterSpan = document.getElementById('countdownSec');
        const dynamicMsgDiv = document.getElementById('dynamicMessage');
        
        // Определяем окружение
        const isTelegramWebApp = !!(window.Telegram && Telegram.WebApp);
        const isStandaloneApk = (window.navigator.standalone === true) || (window.matchMedia('(display-mode: standalone)').matches);
        const isMobileBrowser = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        // Главная функция проверки соединения (работает как Promise)
        async function universalInternetCheck() {
            // 1) быстрый нативный флаг (не всегда точен, но даёт первое мнение)
            if (!navigator.onLine) {
                return false;
            }
            
            // 2) Для Telegram Mini App — используем их Haptic + попытку запроса к их CDN (без CORS)
            if (isTelegramWebApp) {
                try {
                    const tgCheck = await fetch('https://telegram.org/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
                    // no-cors ответ не даёт прочитать статус, но если запрос упал с ошибкой — мы попадём в catch
                    return true;
                } catch (e) {
                    // игнорируем, пробуем другие методы
                }
            }
            
            // 3) Универсальный Image ping (работает даже в APK-WebView, file://)
            const imagePromise = new Promise((resolve) => {
                const img = new Image();
                let resolved = false;
                const timeoutId = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        resolve(false);
                    }
                }, 4500);
                img.onload = () => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeoutId);
                        resolve(true);
                    }
                };
                img.onerror = () => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeoutId);
                        resolve(false);
                    }
                };
                // использовать стабильный URL от Google / Cloudflare (маленький ресурс)
                img.src = 'https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png?t=' + Date.now();
            });
            
            // 4) Дополнительно fetch (если разрешено CORS, но для 'no-cors' не ломается)
            const fetchPromise = new Promise((resolve) => {
                fetch('https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css', { mode: 'no-cors', cache: 'no-store' })
                    .then(() => resolve(true))
                    .catch(() => resolve(false));
            });
            
            // Ждём первый успешный результат (Image ping даёт ответ быстрее)
            const result = await Promise.race([imagePromise, fetchPromise]);
            return result;
        }
        
        // Обновляем UI в зависимости от статуса
        function updateUiBasedOnStatus(isOnline) {
            currentOnline = isOnline;
            if (isOnline) {
                // соединение есть — перезагружаем приложение / главный экран
                dynamicMsgDiv.innerHTML = '✅ Интернет найден!<br>Перезагружаем приложение...';
                retryBtn.disabled = true;
                retryBtn.style.opacity = '0.7';
                // останавливаем все циклы
                if (retryInterval) clearInterval(retryInterval);
                if (countdownInterval) clearInterval(countdownInterval);
                // через 0.4с делаем "перезагрузку" окружения
                setTimeout(() => {
                    fullAppReload();
                }, 600);
            } else {
                dynamicMsgDiv.innerHTML = '❌ Нет доступа к сети.<br>Проверьте Wi-Fi / мобильные данные';
                retryBtn.disabled = false;
                retryBtn.style.opacity = '1';
            }
        }
        
        // Функция полной перезагрузки (работает везде)
        function fullAppReload() {
            try {
                // Telegram WebApp может иметь свой метод закрытия/перезапуска
                if (isTelegramWebApp && window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.close(); // не самое лучшее, но даст обновление
                    // дополнительно пытаемся перезагрузить через location
                    setTimeout(() => { window.location.reload(); }, 200);
                } else if (window.location && window.location.reload) {
                    window.location.reload();
                } else {
                    // fallback для APK: просто пересоздаём DOM (но лучше перезагрузка)
                    window.location.href = window.location.href;
                }
            } catch (e) {
                // Крайний случай
                alert('Соединение восстановлено! Перезапустите приложение вручную.');
            }
        }
        
        // Ручная проверка по кнопке
        async function manualCheck() {
            retryBtn.disabled = true;
            retryBtn.innerHTML = '<span>⏳</span> Проверка...';
            const isOnline = await universalInternetCheck();
            retryBtn.disabled = false;
            retryBtn.innerHTML = '<span>⟳</span> Проверить соединение';
            if (isOnline) {
                updateUiBasedOnStatus(true);
            } else {
                dynamicMsgDiv.innerHTML = '❌ Соединение отсутствует.<br>Попробуйте сменить сеть.';
                // сбросим таймеры, чтобы автопроверка продолжилась
                startAutoRetryCycle();
            }
        }
        
        // Таймер обратного отсчёта и автопроверка
        function startCountdown(seconds, onComplete) {
            if (countdownInterval) clearInterval(countdownInterval);
            let remaining = seconds;
            if (statusFooterSpan) statusFooterSpan.innerText = remaining;
            countdownInterval = setInterval(() => {
                remaining--;
                if (statusFooterSpan) statusFooterSpan.innerText = remaining >= 0 ? remaining : 0;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    if (onComplete) onComplete();
                }
            }, 1000);
        }
        
        async function scheduledCheck() {
            if (!currentOnline) {
                const isOnlineNow = await universalInternetCheck();
                if (isOnlineNow) {
                    updateUiBasedOnStatus(true);
                } else {
                    // снова запускаем цикл
                    startAutoRetryCycle();
                }
            } else {
                startAutoRetryCycle(); // на всякий случай
            }
        }
        
        function startAutoRetryCycle() {
            if (retryInterval) clearInterval(retryInterval);
            if (countdownInterval) clearInterval(countdownInterval);
            remainingSeconds = 4;
            if (statusFooterSpan) statusFooterSpan.innerText = remainingSeconds;
            startCountdown(4, async () => {
                const onlineStatus = await universalInternetCheck();
                if (onlineStatus) {
                    updateUiBasedOnStatus(true);
                } else {
                    // продолжаем цикл
                    startAutoRetryCycle();
                }
            });
        }
        
        // ------------------------------------------------------------------
        // 3. ОФЛАЙН РЕЖИМ: Сохраняем последние сообщения в localStorage
        //    И эмулируем работу приложения без сервера (демо-кеш)
        //    Это позволяет пользователю видеть старые сообщения даже без сети
        // ------------------------------------------------------------------
        function initOfflineModeCaching() {
            // Имитируем кеш сообщений (для мессенджера)
            if (!localStorage.getItem('offline_messages_cache')) {
                const demoCache = {
                    lastChats: [{ name: 'Алексей', lastMsg: 'Привет! Как дела?', time: '12:30', unread: 2 }],
                    messages: [{ id: 1, text: 'Это сообщение доступно офлайн', date: 'Сегодня' }]
                };
                localStorage.setItem('offline_messages_cache', JSON.stringify(demoCache));
            }
            // Показываем уведомление, что офлайн-режим активен
            const offlineNote = document.createElement('div');
            offlineNote.style.position = 'fixed';
            offlineNote.style.bottom = '70px';
            offlineNote.style.left = '16px';
            offlineNote.style.right = '16px';
            offlineNote.style.backgroundColor = 'var(--card-bg)';
            offlineNote.style.borderRadius = '28px';
            offlineNote.style.padding = '10px 16px';
            offlineNote.style.fontSize = '13px';
            offlineNote.style.textAlign = 'center';
            offlineNote.style.border = '1px solid var(--border)';
            offlineNote.style.backdropFilter = 'blur(16px)';
            offlineNote.style.zIndex = '99';
            offlineNote.style.color = 'var(--text-secondary)';
            offlineNote.innerHTML = '📡 Офлайн-режим: последние сообщения доступны';
            document.body.appendChild(offlineNote);
            setTimeout(() => { offlineNote.style.opacity = '0.8'; }, 100);
        }
        
        // ------------------------------------------------------------------
        // 4. Эмуляция работы приложения без сервера (если интернета нет)
        //    В реальном проекте можно показывать кешированные диалоги.
        //    Сейчас добавим "демо-чат" внутри офлайн-окна как подсказку.
        // ------------------------------------------------------------------
        function enableOfflineChatMock() {
            const offlineCard = document.getElementById('offlineRoot');
            if (!offlineCard) return;
            // Добавим кнопку для просмотра кешированных чатов
            const mockBtn = document.createElement('button');
            mockBtn.textContent = '💾 Показать офлайн-чаты';
            mockBtn.style.marginTop = '12px';
            mockBtn.style.backgroundColor = 'transparent';
            mockBtn.style.border = `1px solid var(--border)`;
            mockBtn.style.borderRadius = '40px';
            mockBtn.style.padding = '10px 12px';
            mockBtn.style.fontSize = '14px';
            mockBtn.style.color = 'var(--text-primary)';
            mockBtn.style.cursor = 'pointer';
            mockBtn.style.width = '100%';
            mockBtn.onclick = () => {
                const cached = localStorage.getItem('offline_messages_cache');
                if(cached) {
                    const data = JSON.parse(cached);
                    alert(`📁 Офлайн-доступ:\nДиалоги: ${data.lastChats.map(c=>c.name).join(', ')}\nСообщений в кеше: ${data.messages.length}`);
                } else {
                    alert('Нет сохранённых офлайн данных');
                }
            };
            const retryParent = document.getElementById('retryActionBtn');
            if(retryParent && !document.querySelector('.offline-mock-btn')) {
                mockBtn.classList.add('offline-mock-btn');
                retryParent.insertAdjacentElement('afterend', mockBtn);
            }
        }
        
        // ------------------------------------------------------------------
        // 5. СТАРТ И ГЛАВНАЯ ЛОГИКА
        // ------------------------------------------------------------------
        async function bootOfflineManager() {
            // Сначала проверим реальное состояние сети
            const initialOnline = await universalInternetCheck();
            if (initialOnline) {
                // Если интернет есть, то просто переходим на главный экран (можно убрать)
                dynamicMsgDiv.innerHTML = '✅ Соединение стабильно.<br>Загружаем приложение...';
                setTimeout(() => {
                    fullAppReload();
                }, 800);
                return;
            }
            
            // Нет соединения — полноценный офлайн-режим
            dynamicMsgDiv.innerHTML = '🌐 Нет интернета. Включён офлайн-режим.<br>Попробуйте позже или нажмите кнопку.';
            // Запускаем автоцикл проверки
            startAutoRetryCycle();
            // Активируем кеширование офлайн-данных
            initOfflineModeCaching();
            enableOfflineChatMock();
            
            // Обработчик кнопки ручной проверки
            retryBtn.onclick = () => {
                manualCheck();
            };
            
            // Доп. слушатель события online от браузера (работает в APK и браузерах)
            window.addEventListener('online', async () => {
                const isNowOnline = await universalInternetCheck();
                if(isNowOnline) {
                    updateUiBasedOnStatus(true);
                }
            });
        }
        
        // Запуск
        bootOfflineManager();
        
        // если вдруг скрипт где-то переиспользуется, добавим защиту от двойных таймеров
        window.addEventListener('beforeunload', ()=>{
            if(retryInterval) clearInterval(retryInterval);
            if(countdownInterval) clearInterval(countdownInterval);
        });
        
        // для демонстрации можно дополнительно показать кнопку "Симуляция отправки" (необязательно)
        // но всё же на случай, если пользователь хочет протестировать работу офлайн-режима
        const messageText = document.createElement('div');
        messageText.style.position = 'fixed';
        messageText.style.bottom = '140px';
        messageText.style.right = '16px';
        messageText.style.background = 'var(--accent)';
        messageText.style.color = 'white';
        messageText.style.borderRadius = '40px';
        messageText.style.padding = '6px 14px';
        messageText.style.fontSize = '12px';
        messageText.style.fontWeight = '500';
        messageText.style.opacity = '0.7';
        messageText.innerHTML = '📱 Offline Ready';
        if (document.body) document.body.appendChild(messageText);
    })();
</script>
</body>
</html>
